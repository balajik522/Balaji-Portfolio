<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Typing Speed Test | Balaji Portfolio</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"/>

</head>

<body>

<div class="container">

    <div class="typing-card">

        <h1>
            <i class="fa-solid fa-keyboard"></i>
            Typing Speed Test
        </h1>

        <p class="subtitle">
            Improve your typing speed and accuracy.
        </p>

        <!-- Paragraph -->

        <div class="typing-area">

            <p id="paragraph"></p>

        </div>

        <!-- Hidden Input -->

        <textarea
            id="input"
            placeholder="Start typing here..."
            autofocus
        ></textarea>

        <!-- Stats -->

        <div class="stats">

            <div class="stat-box">

                <h2 id="time">60</h2>

                <span>Seconds</span>

            </div>

            <div class="stat-box">

                <h2 id="wpm">0</h2>

                <span>WPM</span>

            </div>

            <div class="stat-box">

                <h2 id="cpm">0</h2>

                <span>CPM</span>

            </div>

            <div class="stat-box">

                <h2 id="accuracy">100%</h2>

                <span>Accuracy</span>

            </div>

        </div>

        <!-- Buttons -->

        <div class="buttons">

            <button id="restartBtn">

                <i class="fa-solid fa-rotate-right"></i>

                Restart

            </button>

        </div>

    </div>

</div>

<script src="script.js"></script>

</body>

</html>
